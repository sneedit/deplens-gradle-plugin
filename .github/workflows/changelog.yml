name: Update Changelog

on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]
  issues:
    types: [closed, reopened, edited, labeled, unlabeled, milestoned, demilestoned, deleted]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update:
    name: Generate and Commit Changelog
    if: github.repository == 'sneedit/deplens-gradle-plugin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Generate changelog from release tags, closed issues and merged pull requests
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec github_changelog_generator
      - name: Commit changelog when changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update generated changelog'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
