name: Update Changelog

on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update:
    name: Generate and Commit Changelog
    if: github.repository == 'sneedit/deplens-gradle-plugin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Generate changelog from the complete commit history
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --output CHANGELOG.md
      - name: Verify changelog rules against a temporary Git history
        run: python3 scripts/test-changelog.py "$RUNNER_TEMP/git-cliff/bin/git-cliff"
      - name: Commit changelog when changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update generated changelog'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
