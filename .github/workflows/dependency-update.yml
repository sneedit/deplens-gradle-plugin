name: Dependency Update Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Set this repository variable to "yes" only after accepting the public service terms.
env:
  DEVELOCITY_TERMS_OF_USE_AGREE: ${{ vars.DEVELOCITY_TERMS_OF_USE_AGREE }}

jobs:
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and install the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal -Pversion=0.1.0-SNAPSHOT --no-daemon --stacktrace
      - name: Run DepLens on its own build
        run: ./gradlew --init-script scripts/ci-self-check.init.gradle depLensCheck -Pversion=0.1.0-SNAPSHOT --no-daemon --stacktrace
      - name: Summarize updates and verify completeness
        if: always()
        run: python3 scripts/ci-report.py updates build/reports/deplens/depLensCheck.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update-report
          path: build/reports/deplens/depLensCheck.json
          if-no-files-found: warn
