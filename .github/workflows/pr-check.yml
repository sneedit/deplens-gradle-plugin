name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Set this repository variable to "yes" only after accepting the public service terms.
env:
  DEVELOCITY_TERMS_OF_USE_AGREE: ${{ vars.DEVELOCITY_TERMS_OF_USE_AGREE }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test CI reporting and release version validation
        run: python3 scripts/test-ci.py
      - name: Check production nullness contracts
        run: ./gradlew :plugin:nullAway --no-daemon --stacktrace
      - name: Validate plugin task properties
        id: validation
        run: ./gradlew :plugin:validatePlugins --no-daemon --stacktrace
      - name: Summarize validation
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          echo "Plugin validation result: $VALIDATION_OUTCOME. Test results are reported by the Build workflow." >> "$GITHUB_STEP_SUMMARY"
