name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract and validate version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release-version.py "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verification:
    name: Verify Supported Matrix and Release Artifacts
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release-version: ${{ needs.version.outputs.version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: [version, verification]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  release:
    name: Create GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes from the tagged commit history
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --latest --use-branch-tags --strip all --output release-notes.md
      - name: Verify changelog and release note rules
        run: python3 scripts/test-changelog.py "$RUNNER_TEMP/git-cliff/bin/git-cliff"
      - uses: actions/download-artifact@v8
        with:
          name: published-plugin
          path: release-artifacts
      - name: Create GitHub release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$RELEASE_TAG" release-artifacts/*.jar --verify-tag --notes-file release-notes.md --title "Release $RELEASE_VERSION"

  changelog:
    name: Update Changelog After Release
    needs: release
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: ./.github/workflows/changelog.yml
