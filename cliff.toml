# Generate locally and in CI with git-cliff 2.14.2.
[changelog]
header = """
# Changelog

Notable changes, generated from Conventional Commits by [git-cliff](https://git-cliff.org/).

"""
body = """
{% if version %}\
## [{{ version }}](https://github.com/sneedit/deplens-gradle-plugin/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% if previous.version %}
[Compare changes](https://github.com/sneedit/deplens-gradle-plugin/compare/{{ previous.version }}...{% if version %}{{ version }}{% else %}HEAD{% endif %})
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}

{% for commit in entry.commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sneedit/deplens-gradle-plugin/commit/{{ commit.id }}))
{% if commit.breaking_description %}  - **Breaking change:** {{ commit.breaking_description }}
{% endif %}\
{% endfor %}\
{% endfor %}

"""
trim = true
footer = "\n<!-- Generated by git-cliff; do not edit manually. -->\n"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = '^\w+(\([^\r\n)]*\))?!:', group = "Breaking changes" },
    { footer = '(?m)^BREAKING[ -]CHANGE:', group = "Breaking changes" },
    { message = '^feat(\(|:)', group = "Features" },
    { message = '^fix(\(|:)', group = "Bug fixes" },
    { message = '^perf(\(|:)', group = "Performance" },
    { message = '^(build|chore)\(deps\):', group = "Dependency updates" },
    { message = '.*', skip = true },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = '#([0-9]+)', replace = '[#${1}](https://github.com/sneedit/deplens-gradle-plugin/issues/${1})' },
]
