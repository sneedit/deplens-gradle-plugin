plugins {
    id 'java'
}

repositories {
    maven { url = uri('build/fixture-repository') }
}

dependencies {
    implementation 'com.example:demo-library:1.0.0'
}

depLens {
    checkIncludedBuilds = true
    checkBuildSrc = true
    rules {
        dependency('com.example:demo-library') { allowedUpdates = 'minor' }
    }
}
