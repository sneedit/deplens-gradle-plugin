[versions]
gson = "2.14.0"
tomlj = "2.2.0"
springDependencyManagement = "1.1.7"
springBoot = "4.1.1"
protobuf = "0.10.0"
kotlin = "2.4.21"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
gradlePluginPublish = "2.2.1"

jspecify = "1.0.1"
errorProne = "2.50.0"
nullAway = "0.14.2"
errorPronePlugin = "5.1.1"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
error-prone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorProne" }
null-away = { module = "com.uber.nullaway:nullaway", version.ref = "nullAway" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
error-prone = { id = "net.ltgt.errorprone", version.ref = "errorPronePlugin" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradlePluginPublish" }
