import org.gradle.api.attributes.plugin.GradlePluginApiVersion

plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'jacoco'
    alias libs.plugins.gradle.plugin.publish
    alias libs.plugins.error.prone
}

group = 'com.sneedit.deplens'
version = providers.gradleProperty('version').getOrElse('0.1.0-SNAPSHOT')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

// Declare the supported minimum in published variants, independently of the publishing runtime.
['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        attributes.attribute(GradlePluginApiVersion.GRADLE_PLUGIN_API_VERSION_ATTRIBUTE,
                objects.named(GradlePluginApiVersion, '8.8'))
    }
}

def springProtobufTestDependencies = configurations.dependencyScope('springProtobufTestPlugins')
def springKotlinTestDependencies = configurations.dependencyScope('springKotlinTestPlugins') {
    extendsFrom(springProtobufTestDependencies.get())
}
def springProtobufTestConfiguration = configurations.resolvable('springProtobufTestClasspath') {
    extendsFrom(springProtobufTestDependencies.get())
}
def springKotlinTestConfiguration = configurations.resolvable('springKotlinTestClasspath') {
    extendsFrom(springKotlinTestDependencies.get())
}

dependencies {
    implementation gradleApi()
    api libs.jspecify
    errorprone libs.error.prone
    errorprone libs.null.away
    implementation libs.gson
    implementation 'org.tomlj:tomlj:2.2.0'

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    testImplementation gradleTestKit()
    testImplementation 'io.spring.gradle:dependency-management-plugin:1.1.7'
    testRuntimeOnly libs.junit.platform.launcher
    springProtobufTestPlugins 'org.springframework.boot:spring-boot-gradle-plugin:4.1.1'
    springProtobufTestPlugins 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
    springProtobufTestPlugins 'io.spring.gradle:dependency-management-plugin:1.1.7'
    springKotlinTestPlugins 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.errorprone {
        // Test fixtures intentionally exercise absent values; enforce production contracts.
        enabled = name == 'compileJava'
        disableAllChecks = true
        error('NullAway', 'RequireExplicitNullMarking')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgumentProviders.add(new TestPluginClasspathArguments(
            springProtobufTestConfiguration.get(), springKotlinTestConfiguration.get()))
    systemProperty "deplens.test.gradleVersion", providers.gradleProperty("testGradleVersion").getOrElse(gradle.gradleVersion)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('testJavaVersion').getOrElse('21'))
    }
    finalizedBy jacocoTestReport
}

// Resolve fixture plugins when tests run, and declare their files as test inputs.
class TestPluginClasspathArguments implements CommandLineArgumentProvider {
    private final FileCollection springProtobufClasspath
    private final FileCollection springKotlinClasspath

    TestPluginClasspathArguments(FileCollection springProtobufClasspath, FileCollection springKotlinClasspath) {
        this.springProtobufClasspath = springProtobufClasspath
        this.springKotlinClasspath = springKotlinClasspath
    }

    @Classpath
    FileCollection getSpringProtobufClasspath() {
        return springProtobufClasspath
    }

    @Classpath
    FileCollection getSpringKotlinClasspath() {
        return springKotlinClasspath
    }

    @Override
    Iterable<String> asArguments() {
        return [
                "-Ddeplens.test.springProtobufClasspath=${springProtobufClasspath.asPath}".toString(),
                "-Ddeplens.test.springKotlinClasspath=${springKotlinClasspath.asPath}".toString()
        ]
    }
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

def repositoryUrl = providers.gradleProperty('repositoryUrl')

gradlePlugin {
    website = repositoryUrl
    vcsUrl = repositoryUrl.map { it.endsWith('.git') ? it : it + '.git' }

    plugins {
        depLens {
            id = 'com.sneedit.deplens'
            displayName = 'DepLens - Dependency Updates'
            description = 'Gradle-native dependency, plugin and wrapper update checks with safe interactive version edits.'
            tags = ['dependencies', 'updates', 'versions', 'maintenance']
            implementationClass = 'com.sneedit.deplens.DepLensPlugin'
            compatibility(it) {
                features {
                    configurationCache = true
                    isolatedProjects = true
                }
            }
        }
        depLensSettings {
            id = 'com.sneedit.deplens.settings'
            displayName = 'DepLens - Settings Integration'
            description = 'Capture settings plugin versions and apply DepLens inventory, update checks and interactive edits to the root project.'
            tags = ['dependencies', 'updates', 'versions', 'maintenance']
            implementationClass = 'com.sneedit.deplens.DepLensSettingsPlugin'
            compatibility(it) {
                features {
                    configurationCache = true
                    isolatedProjects = true
                }
            }
        }
    }
}

// Keep the implementation and both generated plugin marker publications consistent.
publishing {
    // Local verification only; never uploads to the Plugin Portal or another remote repository.
    repositories {
        maven {
            name = 'releaseVerification'
            url = providers.gradleProperty('releaseVerificationDirectory').map { new File(it) }
                    .orElse(layout.buildDirectory.dir('release-verification/repository').map { it.asFile })
        }
        maven {
            name = 'centralStaging'
            url = providers.gradleProperty('centralStagingDirectory').map { new File(it) }
                    .orElse(layout.buildDirectory.dir('central-staging').map { it.asFile })
        }
    }
    publications.withType(MavenPublication).configureEach {
        pom {
            name.convention('DepLens')
            description.convention('Gradle-native dependency, plugin and wrapper updates with safe interactive version edits.')
            url = repositoryUrl
            inceptionYear = '2026'
            developers {
                developer {
                    id = 'sneedit'
                    name = 'Sneed IT'
                    url = 'https://github.com/sneedit'
                }
            }
            scm {
                url = repositoryUrl
                connection = repositoryUrl.map { 'scm:git:' + (it.endsWith('.git') ? it : it + '.git') }
                developerConnection = connection
            }
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
        }
    }
}

// Signing is opt-in so normal builds and local installation require no keys.
def signPublications = providers.gradleProperty('signPublications').map(Boolean::parseBoolean).orElse(false)
if (signPublications.get()) {
    apply plugin: 'signing'
    signing {
        required = true
        useInMemoryPgpKeys(providers.gradleProperty('signingInMemoryKey').getOrNull(),
                providers.gradleProperty('signingInMemoryKeyPassword').getOrElse(''))
    }
    // com.gradle.plugin-publish signs its implementation and marker publications
    // automatically when Gradle's signing plugin is applied.
}

// Ship legal notices with every published artifact, including sources and Javadoc.
def legalNotices = files('../LICENSE', '../NOTICE')
tasks.withType(Jar).configureEach {
    manifest.attributes('Implementation-Title': 'DepLens', 'Implementation-Version': project.version.toString())
    from(legalNotices) { into 'META-INF' }
}

// Validate locally without invoking the Portal task or reading publication credentials.
@org.gradle.work.DisableCachingByDefault(because = 'Checks release inputs without producing an artifact')
abstract class ValidateReleaseMetadata extends DefaultTask {
    @Input
    abstract Property<String> getReleaseVersion()

    @Input
    abstract Property<String> getRepositoryUrl()

    @TaskAction
    void validateReleaseMetadata() {
        if (!(releaseVersion.get() ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/)) {
            throw new GradleException('Expected a stable release version X.Y.Z, without leading zeros, a v prefix or prerelease suffix.')
        }
        def address = repositoryUrl.get()
        try {
            def uri = new URI(address)
            if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment
                    || !uri.path || uri.path == '/' || address.contains('REPLACE_ME') || address.contains('yourusername')) {
                throw new IllegalArgumentException('Invalid repository metadata')
            }
        } catch (Exception ignored) {
            throw new GradleException('Set repositoryUrl to the real HTTPS repository URL without credentials, query or fragment.')
        }
    }
}

def validateRelease = tasks.register('validateRelease', ValidateReleaseMetadata) {
    group = 'verification'
    description = 'Validate stable release version and repository metadata without publishing'
    releaseVersion.set(project.version.toString())
    getRepositoryUrl().set(providers.gradleProperty('repositoryUrl').orElse(''))
}

tasks.named('publishPlugins') {
    dependsOn validateRelease
}
tasks.named('publishAllPublicationsToReleaseVerificationRepository') {
    dependsOn validateRelease
}

@org.gradle.work.DisableCachingByDefault(because = 'Checks explicit signing opt-in without producing an artifact')
abstract class ValidateCentralSigning extends DefaultTask {
    @Input
    abstract Property<Boolean> getSigningEnabled()

    @TaskAction
    void validateSigning() {
        if (!signingEnabled.get()) {
            throw new GradleException('Maven Central staging requires -PsignPublications=true and an in-memory PGP signing key.')
        }
    }
}

def validateCentralSigning = tasks.register('validateCentralSigning', ValidateCentralSigning) {
    signingEnabled.set(signPublications)
}
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    if (name.endsWith('ToCentralStagingRepository')) {
        dependsOn validateRelease, validateCentralSigning
    }
}
tasks.withType(Sign).configureEach {
    dependsOn validateRelease
}

// compileJava always enforces nullness; this task provides a focused CI/local entry point.
tasks.register('nullAway') {
    group = 'verification'
    description = 'Compile production sources with strict JSpecify/NullAway checking'
    dependsOn tasks.named('compileJava')
}
