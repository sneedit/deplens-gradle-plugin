// Bootstrap the built plugin without adding it to its own compile classpath.
initscript {
    repositories { mavenLocal(); mavenCentral() }
    dependencies {
        classpath "com.sneedit.deplens:plugin:${gradle.startParameter.projectProperties.getOrDefault('version', '0.3.0-SNAPSHOT')}"
    }
}
gradle.rootProject { project ->
    project.pluginManager.apply(com.sneedit.deplens.DepLensPlugin)
}
